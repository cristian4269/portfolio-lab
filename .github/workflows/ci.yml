name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned so the export check below cannot fail on a newer uv's formatting.
          version: "0.12.20"
          enable-cache: true
      - name: Deploy requirements match the lock
        # app/requirements.txt is what Streamlit Community Cloud installs; comments aside, it
        # must equal a fresh export of uv.lock (regenerate with the command in its header).
        run: |
          uv export --quiet --locked --no-dev --group app --no-hashes --format requirements-txt \
            -o "$RUNNER_TEMP/requirements.txt"
          diff -u <(grep -v '^ *#' app/requirements.txt) <(grep -v '^ *#' "$RUNNER_TEMP/requirements.txt")
      - name: Install
        run: uv sync --locked --all-groups
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy src/portfolio_lab
      - name: Test
        run: uv run pytest --cov --cov-report=term
